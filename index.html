<!DOCTYPE html>
<html lang="es-ES">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GestorIA · Versión 1</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1b3a4b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <h1 class="brand">Gestor<span>IA</span></h1>
        <p class="sub">Versión 1 · documentos, trimestre y NRC. Nada se presenta solo.</p>
      </div>
      <div class="clock" id="clock"></div>
    </header>
    <nav class="tabs">
      <button class="on" data-tab="docs">Documentos</button>
      <button data-tab="trimestre">Trimestre 3T</button>
      <button data-tab="entidades">Entidades</button>
    </nav>
    <section id="tab-docs">
      <div class="grid">
        <article class="card">
          <h2>Subir factura o ticket</h2>
          <p class="muted">PDF o foto. Completa a mano si la lectura falla.</p>
          <div class="drop" id="drop">
            <p>Suelta el archivo o</p>
            <button class="btn sec" type="button" id="pickBtn">Elegir archivo</button>
            <input id="file" type="file" accept="application/pdf,image/*" />
          </div>
          <div class="preview" id="preview"></div>
          <div class="row"><div><label>Entidad</label><select id="entidad"></select></div>
            <div><label>Tipo</label><select id="tipo"><option value="recibida">Recibida</option><option value="emitida">Emitida</option></select></div></div>
          <div class="row"><div><label>NIF</label><input id="nif" /></div><div><label>Nombre</label><input id="nombre" /></div></div>
          <div class="row"><div><label>Número</label><input id="numero" /></div><div><label>Fecha</label><input id="fecha" type="date" /></div></div>
          <div class="row"><div><label>Base €</label><input id="base" type="number" step="0.01" /></div>
            <div><label>IVA %</label><select id="ivaTipo"><option>21</option><option>10</option><option>4</option><option>0</option></select></div></div>
          <div class="row"><div><label>Cuota IVA €</label><input id="cuota" type="number" step="0.01" /></div><div><label>Total €</label><input id="total" type="number" step="0.01" /></div></div>
          <p class="muted" id="ocrMsg"></p>
          <button class="btn sec" type="button" id="ocrBtn">Leer documento</button>
          <button class="btn" type="button" id="saveBtn">Guardar en bandeja</button>
        </article>
        <article class="card">
          <h2>Bandeja</h2>
          <p class="muted">Solo lo validado entra en el 303.</p>
          <div class="list" id="lista"></div>
        </article>
      </div>
    </section>
    <section id="tab-trimestre" class="hidden">
      <article class="card">
        <h2>Borrador 303 · 3T 2026</h2>
        <label>Entidad</label><select id="entidad303"></select>
        <div class="kpi" id="kpi"></div>
        <table id="tabla303"></table>
        <p id="bloque303" class="warnbox hidden"></p>
        <h2>Pago</h2>
        <p id="viaPago" class="muted"></p>
        <label>NRC (22 caracteres)</label>
        <input id="nrc" maxlength="22" />
        <label class="check"><input type="checkbox" id="autorizo" /><span>He revisado el importe y autorizo. GestorIA no envía a Hacienda sola.</span></label>
        <button class="btn ok" type="button" id="cerrarBtn">Registrar autorización</button>
        <p id="pagoMsg"></p>
      </article>
    </section>
    <section id="tab-entidades" class="hidden">
      <article class="card">
        <h2>Entidades</h2>
        <div class="row"><div><label>NIF</label><input id="enNif" /></div><div><label>Nombre</label><input id="enNom" /></div></div>
        <button class="btn" type="button" id="addEnt">Añadir entidad</button>
        <div class="list" id="listaEnt" style="margin-top:14px"></div>
      </article>
    </section>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
