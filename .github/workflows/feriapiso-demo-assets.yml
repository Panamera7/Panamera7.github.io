name: Decode feriapiso-demo assets
on:
  workflow_dispatch:
  push:
    paths:
      - feriapiso-demo/assets-b64/**
      - .github/workflows/feriapiso-demo-assets.yml
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets to JPEGs
        run: |
          set -e
          mkdir -p feriapiso-demo/fotos/p1 feriapiso-demo/fotos/p2 feriapiso-demo/fotos/p3 feriapiso-demo/brand
          for f in feriapiso-demo/assets-b64/*.b64; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .b64)
            if [[ "$base" == "logo.png" ]]; then
              out="feriapiso-demo/brand/logo.png"
            elif [[ "$base" == *__* ]]; then
              apt="${base%%__*}"
              file="${base#*__}"
              out="feriapiso-demo/fotos/${apt}/${file}"
            else
              out="feriapiso-demo/fotos/${base}"
            fi
            base64 -d "$f" > "$out"
            echo "wrote $out ($(wc -c < "$out") bytes)"
          done
          ls -laR feriapiso-demo/fotos feriapiso-demo/brand || true
      - name: Commit decoded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feriapiso-demo/fotos feriapiso-demo/brand
          git diff --staged --quiet || git commit -m "feriapiso-demo: decode photo assets"
          git push
